name: CI
on:
  push:
    branches:
      - 'master'
  pull_request:
jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Format Check
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --all-features --all-targets -- -D warnings
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-features --all-targets
  build:
    name: Build binaries
    needs:
      - lint
      - test
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: davidB/rust-cargo-make@v1.16.0
        with:
          version: 0.32.12
      - name: Run CI
        run: cargo make ci-flow
